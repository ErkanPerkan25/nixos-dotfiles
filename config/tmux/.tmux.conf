# only this line might not be enough
set -g default-terminal "tmux-256color"

set-option -a terminal-features 'alacritty:RGB'

set-option -ga terminal-overrides "alacritty:Tc"


# Needs this line also to overrides the default color


##### General settings ##############
set -s escape-time 0

set -g display-time 4000

set-option -g focus-events on

set -g status-style 'bg=#3c3836 fg=#20a5d6'

set -g mouse on

set -g pane-scrollbars on
set -g pane-scrollbars-position right

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi M-Up send-keys -X scroll-up
bind-key -T copy-mode-vi M-Down send-keys -X scroll-down
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

unbind -T copy-mode-vi MouseDragEnd1Pane
 
# reload config file (change file location to your the tmux.conf you want to use)
unbind r
bind r source-file ~/.tmux.conf
